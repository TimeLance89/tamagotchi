name: Simulationstests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node.js Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Simulation testen
        run: npm test
