name: mio. Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - '*.html'
      - '*.css'
      - '*.mjs'
      - 'icon.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4
      - name: Java 17 vorbereiten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node.js 22 vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulationstests
        run: npm test
      - name: Vorhandenes Android SDK prüfen
        run: |
          echo "SDK: $ANDROID_HOME"
          ls -l "$ANDROID_HOME/platforms" || true
          ls -l "$ANDROID_HOME/build-tools" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          test -x "$SDKMANAGER"
      - name: Android Plattform sicherstellen
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$SDKMANAGER" --install 'platforms;android-35'
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$SDKMANAGER" --install 'build-tools;35.0.0'
          fi
      - name: Gradle vorbereiten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Original-Spiel ins APK einbetten
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css evolution.css app.mjs engine.mjs evolution.mjs evolution-ui.mjs wild.css wild-app.mjs wild-engine.mjs icon.svg android/app/src/main/assets/
      - name: Android APK erstellen
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: APK bereitstellen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mio-android-preview.apk
          sha256sum mio-android-preview.apk
      - name: APK als Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: mio-android-apk
          path: mio-android-preview.apk
          if-no-files-found: error
      - name: Öffentliche Testversion bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-preview >/dev/null 2>&1 || gh release create android-preview --target "${{ github.sha }}" --title "mio. Android Preview" --notes "Installierbare Android-Testversion von mio. – offline, mit Evolution und lokalem Spielstand. APK aus den GitHub-Actions-Builds. Mindestversion: Android 10. Debug-Signatur; vor Updates bitte Spielstand exportieren." --prerelease
          gh release upload android-preview mio-android-preview.apk --clobber
