plugins {
    id 'com.android.application'
}

android {
    namespace 'de.zerotower.mio'
    compileSdk 35

    defaultConfig {
        applicationId 'de.zerotower.mio'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
